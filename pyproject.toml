[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bogataya-life"
version = "0.1.0"
description = "Bogataya life Telegram bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyjson5",
  "pytz"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
